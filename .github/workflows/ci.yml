name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t linkedin-content-manager:ci .

      - name: Smoke test the built image (stage a draft, then list it back)
        run: |
          docker run --rm --entrypoint sh linkedin-content-manager:ci -c "
            python -m linkedin_content_manager new --title 'CI smoke test' --body-file content/example-body.txt &&
            python -m linkedin_content_manager list
          "
